<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glass Card Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Text Gradient Primary -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Text Gradient Secondary -->
    <linearGradient id="subtext-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="45" result="blur" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 38px; fill: url(#text-grad); }
    .subtitle { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: url(#subtext-grad); letter-spacing: 2px; }
    .desc { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 13px; fill: #94a3b8; }
    .tag { font-family: 'Fira Code', monospace; font-size: 11px; fill: #38bdf8; }
    .badge-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 11px; fill: #34d399; letter-spacing: 1px; }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .orb-1 { animation: pulse 6s ease-in-out infinite; transform-origin: 150px 100px; }
    .orb-2 { animation: pulse 8s ease-in-out infinite alternate; transform-origin: 700px 150px; }
    .floating-card { animation: float 5s ease-in-out infinite; }
  </style>

  <!-- Outer Canvas Base -->
  <rect width="850" height="250" rx="20" fill="url(#bg-grad)"/>

  <!-- Ambient Glowing Orbs -->
  <circle class="orb-1" cx="150" cy="80" r="100" fill="#0284c7" opacity="0.35" filter="url(#glow-cyan)"/>
  <circle class="orb-2" cx="720" cy="170" r="120" fill="#7e22ce" opacity="0.35" filter="url(#glow-purple)"/>

  <!-- Glassmorphism Container Card -->
  <g class="floating-card">
    <rect x="25" y="25" width="800" height="200" rx="16" fill="#1e293b" fill-opacity="0.45" stroke="url(#border-grad)" stroke-width="1.5"/>

    <!-- Subtle Glass Reflection Line -->
    <path d="M 26 26 L 824 26 C 824 26 800 65 26 65 Z" fill="#ffffff" fill-opacity="0.03" />

    <!-- Terminal Pill Indicator -->
    <rect x="50" y="48" width="180" height="26" rx="13" fill="#0f172a" fill-opacity="0.7" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="64" cy="61" r="4" fill="#34d399"/>
    <text x="76" y="65" class="badge-text">OPEN FOR COLLAB</text>

    <!-- Main Heading -->
    <text x="50" y="116" class="title">AKSHAY <tspan fill="#f8fafc" font-weight="300">|</tspan> notcaliper</text>

    <!-- Subtitle & Domain Focus -->
    <text x="50" y="144" class="subtitle">FULL STACK • AI • BLOCKCHAIN • IOT</text>
    
    <!-- Brief Description -->
    <text x="50" y="172" class="desc">Engineering autonomous hardware, computer vision &amp; Web3 protocols.</text>

    <!-- Tech Tag Deco on Right -->
    <g transform="translate(625, 45)">
      <rect x="0" y="0" width="175" height="155" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <text x="14" y="30" class="tag">&gt; status: active</text>
      <text x="14" y="55" class="tag">&gt; focus: autonomous</text>
      <text x="14" y="80" class="tag">&gt; stack: rust/py/sol</text>
      <text x="14" y="105" class="tag">&gt; loc: earth 🌍</text>
      <text x="14" y="130" class="tag">&gt; build_in_pub: true</text>
    </g>
  </g>
</svg>
