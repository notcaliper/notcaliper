<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 130" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footer-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glowing Border -->
    <linearGradient id="footer-border-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Quote Gradient -->
    <linearGradient id="footer-quote-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="f-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
    </filter>
  </defs>

  <style>
    .quote-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-style: italic; font-weight: 500; font-size: 16px; fill: url(#footer-quote-grad); }
    .subquote-text { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11.5px; fill: #38bdf8; letter-spacing: 0.5px; }
    .telemetry-meta { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 9.5px; fill: #64748b; letter-spacing: 1.5px; }
    
    @keyframes beaconPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .f-beacon { animation: beaconPulse 2s ease-in-out infinite; }
  </style>

  <!-- Ambient Glow Behind -->
  <rect x="50" y="10" width="850" height="110" rx="16" fill="#0284c7" opacity="0.15" filter="url(#f-glow)"/>

  <!-- Main Card Container -->
  <g transform="translate(15, 10)">
    <rect width="920" height="110" rx="16" fill="url(#footer-bg-grad)" stroke="url(#footer-border-glow)" stroke-width="1.2"/>
    
    <!-- Top HUD Border Highlight -->
    <path d="M 1 20 L 1 10 C 1 5.029 5.029 1 10 1 L 910 1 C 914.971 1 919 5.029 919 10 L 919 20" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.4"/>

    <!-- Corner Sci-Fi Brackets -->
    <path d="M 0 20 L 0 0 L 20 0" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <path d="M 900 0 L 920 0 L 920 20" stroke="#c084fc" stroke-width="2" fill="none"/>
    <path d="M 0 90 L 0 110 L 20 110" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <path d="M 900 110 L 920 110 L 920 90" stroke="#c084fc" stroke-width="2" fill="none"/>

    <!-- Quote -->
    <text x="460" y="44" class="quote-text" text-anchor="middle">"Turning complex ideas into seamless code &amp; hardware systems."</text>
    
    <!-- Terminal Prompt Sub-line -->
    <text x="460" y="70" class="subquote-text" text-anchor="middle"><tspan fill="#818cf8">&gt;</tspan> Building in public • Open for innovative engineering collaborations</text>

    <!-- Bottom Telemetry Bar -->
    <g transform="translate(460, 93)">
      <circle class="f-beacon" cx="-120" cy="-3" r="3" fill="#34d399"/>
      <text x="-110" y="0" class="telemetry-meta" text-anchor="start">UPTIME: 99.9%</text>
      
      <circle cx="-5" cy="-3" r="2" fill="#38bdf8"/>
      
      <circle class="f-beacon" cx="35" cy="-3" r="3" fill="#38bdf8"/>
      <text x="45" y="0" class="telemetry-meta" text-anchor="start">STATUS: BUILDING</text>
    </g>
  </g>
</svg>
