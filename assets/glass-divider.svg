<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 30" width="100%" height="100%">
  <defs>
    <linearGradient id="div-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="15%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow-line" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
    </filter>
  </defs>
  <rect x="25" y="14" width="800" height="2" rx="1" fill="url(#div-grad)" />
  <rect x="25" y="14" width="800" height="2" rx="1" fill="url(#div-grad)" filter="url(#glow-line)" opacity="0.7"/>
  <!-- Central Diamond Accent -->
  <g transform="translate(425, 15)">
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2" fill="#38bdf8"/>
  </g>
</svg>
