<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 32" width="100%" height="100%">
  <defs>
    <!-- Base Gradient -->
    <linearGradient id="div-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1"/>
      <stop offset="80%" stop-color="#c084fc" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- Moving Laser Light Pulse -->
    <linearGradient id="laser-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0">
        <animate attributeName="offset" values="-0.5;1.5" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.9">
        <animate attributeName="offset" values="-0.35;1.65" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0">
        <animate attributeName="offset" values="-0.2;1.8" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="div-glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes diamondPulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    .center-prism { animation: diamondPulse 3s ease-in-out infinite; transform-origin: 475px 16px; }
  </style>

  <!-- Ambient Glow Line -->
  <line x1="40" y1="16" x2="910" y2="16" stroke="url(#div-line-grad)" stroke-width="2.5" filter="url(#div-glow)" opacity="0.8"/>

  <!-- Core Sharp Laser Line -->
  <line x1="40" y1="16" x2="910" y2="16" stroke="url(#div-line-grad)" stroke-width="1.2"/>

  <!-- Animated Laser Shimmer -->
  <line x1="40" y1="16" x2="910" y2="16" stroke="url(#laser-pulse)" stroke-width="2" filter="url(#div-glow)"/>

  <!-- Central Sci-Fi Prism Element -->
  <g class="center-prism" transform="translate(475, 16)">
    <!-- Outer Diamond -->
    <polygon points="0,-8 9,0 0,8 -9,0" fill="#030712" stroke="#818cf8" stroke-width="1.5"/>
    <!-- Inner Diamond -->
    <polygon points="0,-4 4.5,0 0,4 -4.5,0" fill="#38bdf8" fill-opacity="0.7"/>
    <!-- Core Bright Dot -->
    <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Flanking Accent Marks -->
  <circle cx="445" cy="16" r="1.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="455" cy="16" r="2" fill="#818cf8" opacity="0.8"/>
  <circle cx="495" cy="16" r="2" fill="#818cf8" opacity="0.8"/>
  <circle cx="505" cy="16" r="1.5" fill="#c084fc" opacity="0.7"/>
</svg>
